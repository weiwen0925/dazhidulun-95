<style>
:root{--bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;--accent:#8b5e3c;--accentL:#c4956a;--accent-red:#8B2500;--gold:#b8860b;--goldL:#d4a84b;--border:#d4c4a8;--card:#fffdf7;--verseBg:#f0e8d8;--verseBd:#c4956a;--sbW:88px;--sbBg:#1e1a14;--sbText:#d4c4a8;--headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);--r:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{scrollbar-width:none;-ms-overflow-style:none;-webkit-user-select:none;user-select:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif TC","Songti TC",Georgia,serif;font-size:20px;line-height:1.8;}
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;background:var(--sbBg);color:var(--sbText);z-index:100;display:flex;flex-direction:column;align-items:center;padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;font-family:"Noto Sans TC",sans-serif;color:var(--gold);text-align:center;line-height:1.5;background:linear-gradient(to bottom,var(--sbBg) 80%,rgba(30,26,20,0));padding:14px 4px 12px;margin-bottom:8px;z-index:5;text-decoration:none;cursor:pointer;transition:color .25s;display:block;border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand-line2{display:block;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--goldL);margin-top:2px;}
.sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:3px;}
.sb-nav{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;width:100%;text-decoration:none;color:var(--sbText);border-radius:8px;transition:background .2s,color .2s;}
.sb-item:hover{background:rgba(184,134,11,.16);}
.sb-item.active{background:rgba(184,134,11,.28);box-shadow:0 0 12px rgba(184,134,11,.4);}
.sb-circle{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC",sans-serif;font-size:16px;font-weight:600;color:var(--goldL);}
.sb-item.active .sb-circle{background:var(--gold);color:#1e1a14;}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;letter-spacing:.3px;opacity:.86;text-align:center;}
.main{margin-left:var(--sbW);}
.site-hero{position:relative;background:var(--headGrad);color:#f4ecda;text-align:center;padding:64px 24px 56px;overflow:hidden;}
.hero-juan{font-family:"Noto Sans TC",sans-serif;font-size:15px;letter-spacing:6px;color:var(--goldL);opacity:.9;margin-bottom:16px;}
.hero-title{font-size:52px;font-weight:900;color:#f7efd9;letter-spacing:3px;line-height:1.25;}
.hero-sep{width:80px;height:2px;background:var(--gold);margin:22px auto;}
.hero-subtitle{font-size:19px;color:#e6dbc2;line-height:1.9;font-weight:400;}
.hero-meta{font-family:"Noto Sans TC",sans-serif;font-size:16px;color:#cdbf9f;margin-top:18px;letter-spacing:1px;}
.hero-range{font-family:"Noto Sans TC",sans-serif;font-size:14.5px;color:var(--goldL);margin-top:10px;letter-spacing:1px;opacity:.85;}
.preface{max-width:860px;margin:40px auto 0;padding:0 28px;}
.preface-title{font-family:"Noto Sans TC",sans-serif;font-size:13px;letter-spacing:4px;color:var(--gold);text-align:center;}
.preface-sub{text-align:center;font-size:26px;font-weight:700;color:var(--accent);margin:6px 0 22px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin-bottom:16px;text-align:justify;}
.toc-section{max-width:1100px;margin:48px auto 0;padding:0 28px;}
.toc-title{text-align:center;font-size:34px;font-weight:700;color:var(--accent);letter-spacing:8px;}
.toc-desc{text-align:center;font-family:"Noto Sans TC",sans-serif;font-size:16px;color:var(--text-muted);margin:10px 0 28px;letter-spacing:1px;}

.ch-body{padding-top:26px;}
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);border-left:5px solid var(--gold);border-radius:10px;padding:20px 26px;margin:0 0 26px;box-shadow:0 2px 10px rgba(91,58,41,.06);}

.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:12.5px;background:var(--gold);color:#fff;padding:4px 14px;border-radius:12px;letter-spacing:2.2px;margin-bottom:12px;}

.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;text-align:justify;}
.ch-frame{display:block;width:100%;border:0;background:#fffdf7;border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px rgba(91,58,41,.1);margin:0 0 8px;min-height:180px;}
.next-link{display:inline-block;margin-top:18px;font-family:"Noto Sans TC",sans-serif;font-size:16px;color:var(--accent);text-decoration:none;border:1px solid var(--gold);border-radius:24px;padding:8px 22px;transition:background .2s,color .2s;}
.next-link:hover{background:var(--gold);color:#fff;}
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:rgba(30,26,20,.92);color:var(--gold);padding:9px 24px;border-radius:30px;border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;backdrop-filter:blur(6px);transition:opacity .45s ease,transform .45s ease;}

.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.85;letter-spacing:4px;color:var(--goldL);}
#backTop{position:fixed;right:24px;bottom:24px;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:20px;cursor:pointer;display:none;z-index:120;box-shadow:0 3px 12px rgba(0,0,0,.25);}
#sbToggle{display:none;position:fixed;left:12px;top:12px;z-index:130;width:42px;height:42px;border:0;border-radius:8px;background:var(--sbBg);color:var(--gold);font-size:20px;cursor:pointer;}
.site-footer{text-align:center;font-family:"Noto Sans TC",sans-serif;font-size:15px;color:var(--text-muted);padding:48px 24px 90px;margin-top:48px;border-top:1px solid var(--border);letter-spacing:1px;}
@media(max-width:900px){#sb{transform:translateX(-100%);transition:transform .3s;}#sb.open{transform:none;}.main{margin-left:0;}#sbToggle{display:block;}.hero-title{font-size:38px;}.chapter,.toc-section,.preface{padding:0 16px;}.toc-grid{grid-template-columns:1fr;}}

<script>
var rpFill=document.getElementById('rpFill'),rpPct=document.getElementById('rpPct');
function updateProgress(){var sh=document.documentElement.scrollHeight-window.innerHeight;var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;if(rpFill)rpFill.style.width=pct+'%';if(rpPct)rpPct.textContent=Math.round(pct)+'%';}
window.addEventListener('scroll',updateProgress,{passive:true});updateProgress();
function resizeFrame(f){try{var d=f.contentDocument||f.contentWindow.document;if(!d||!d.body)return;d.body.style.minHeight='0';d.body.style.height='auto';if(d.documentElement){d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';}var h=d.body.scrollHeight;if(h>100){f.style.height=h+'px';f.style.minHeight='0';}}catch(e){}}
function resizeAllFrames(){document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);if(typeof updateProgress==='function')updateProgress();}
function setupFrame(f){var tries=0;function tick(){tries++;resizeFrame(f);if(tries<30)setTimeout(tick,200);}if(f.contentDocument&&f.contentDocument.readyState==='complete'){tick();}else{f.addEventListener('load',tick);}}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);});
document.addEventListener('click',function(e){var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;if(!a)return;var h=a.getAttribute('href');if(!h||h.charAt(0)!=='#'||h.length<2)return;var id=h.substring(1);var el=document.getElementById(id);if(!el)return;e.preventDefault();resizeAllFrames();setTimeout(function(){resizeAllFrames();var rect=el.getBoundingClientRect();var y=window.scrollY+rect.top-20;window.scrollTo({top:y,behavior:'smooth'});},60);},true);
var _rt=0,_riv=setInterval(function(){_rt++;resizeAllFrames();if(_rt>50)clearInterval(_riv);},300);
// sidebar highlight
var secs=Array.prototype.slice.call(document.querySelectorAll('section.chapter'));
var items=Array.prototype.slice.call(document.querySelectorAll('.sb-item'));
function highlight(){var idx=-1;for(var i=0;i<secs.length;i++){if(secs[i].getBoundingClientRect().top<window.innerHeight*0.35)idx=i;}items.forEach(function(it,i){it.classList.toggle('active',i===idx);});}
window.addEventListener('scroll',highlight,{passive:true});highlight();
// backTop
var bt=document.getElementById('backTop');window.addEventListener('scroll',function(){bt.style.display=window.scrollY>600?'block':'none';},{passive:true});
bt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
document.getElementById('sbBrand').addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});
// hamburger
var tg=document.getElementById('sbToggle'),sb=document.getElementById('sb');tg.addEventListener('click',function(){sb.classList.toggle('open');});
// progress fade near footer
(function(){var cap=document.getElementById('readProgress');if(!cap)return;function setHide(on){cap.classList.toggle('hide-near-end',!!on);}var t=document.querySelector('.site-footer');if(!t)return;if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){setHide(es.some(function(e){return e.isIntersecting;}));},{rootMargin:'0px 0px -20px 0px',threshold:0.01});io.observe(t);}})();
// anti-copy outer
(function(){var blk=function(e){e.preventDefault();return false;};['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){document.addEventListener(ev,blk,true);});document.addEventListener('keydown',function(e){var k=e.key;if(e.ctrlKey&&'cCaAsSpPuUxX'.indexOf(k)>=0)blk(e);if(k==='F12')blk(e);if(e.ctrlKey&&e.shiftKey&&'IJCK'.indexOf(k)>=0)blk(e);},true);})();
</script>

<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-95-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
